# Production deploy (Dokploy). agent-team drives the host's Docker daemon and hands it host paths to
# mount into agent sandboxes, so it runs with the host's network, PIDs and home directory: every path
# and port it uses must mean the same thing inside and outside this container.
x-agent-team: &agent-team
  build: .
  image: agent-team:latest
  user: "${AGENT_TEAM_UID:-1000}:${AGENT_TEAM_GID:-1000}"
  group_add:
    - "${DOCKER_GID:-989}"
  network_mode: host
  pid: host
  environment:
    HOME: ${AGENT_TEAM_HOME:-/home/opc}
  # Dokploy runs compose inside its own container, where host files are not visible, so env_file
  # cannot point at the host. The token file is read at start from the mounted home instead; it
  # holds CLAUDE_CODE_OAUTH_TOKEN and stays on the host, out of the repository and Dokploy.
  entrypoint: ["sh", "-c", "set -a && . \"$$HOME/.config/agent-team/doctor.env\" && set +a && exec \"$$@\"", "agent-team"]
  volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - /tmp:/tmp
    - ${AGENT_TEAM_HOME:-/home/opc}:${AGENT_TEAM_HOME:-/home/opc}
  restart: unless-stopped

services:
  ui:
    <<: *agent-team
    command: ["node", "--disable-warning=ExperimentalWarning", "src/cli.ts", "ui", "${AGENT_TEAM_HOME:-/home/opc}/agent-team-runs", "--port", "4400"]

  doctor:
    <<: *agent-team
    command: ["node", "--disable-warning=ExperimentalWarning", "src/cli.ts", "doctor", "${AGENT_TEAM_HOME:-/home/opc}/agent-team-runs"]
