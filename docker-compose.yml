# Production deploy (Dokploy). agent-team drives the host's Docker daemon and hands it host paths to
# mount into agent sandboxes, so it runs with the host's network, PIDs and home directory: every path
# and port it uses must mean the same thing inside and outside this container.
x-agent-team: &agent-team
  build: .
  image: agent-team:latest
  user: "${AGENT_TEAM_UID:-1000}:${AGENT_TEAM_GID:-1000}"
  group_add:
    - "${DOCKER_GID:-989}"
  network_mode: host
  pid: host
  environment: &agent-team-environment
    HOME: ${AGENT_TEAM_HOME:-/home/opc}
    # Each run gets its own container from this image, so a redeploy of ui and doctor does not kill it.
    AGENT_TEAM_RUN_IMAGE: agent-team:latest
  # The image's entrypoint (docker/entrypoint.sh) loads $HOME/.config/agent-team/doctor.env from the mounted home.
  volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - /tmp:/tmp
    - ${AGENT_TEAM_HOME:-/home/opc}:${AGENT_TEAM_HOME:-/home/opc}
  restart: unless-stopped

services:
  ui:
    <<: *agent-team
    # The edge Caddy runs in a bridge container and cannot reach the host's loopback, so the UI binds to
    # the docker0 gateway. That address is not reachable from the internet. The UI refuses a non-loopback
    # bind without a login, so doctor.env must set AGENT_TEAM_UI_PASSWORD_HASH and
    # AGENT_TEAM_UI_SESSION_SECRET (or AGENT_TEAM_UI_TRUSTED_PROXIES and AGENT_TEAM_UI_PROXY_USER_HEADER).
    # Wrap the hash in single quotes there: AGENT_TEAM_UI_PASSWORD_HASH='scrypt$32768$8$1$...'
    environment:
      <<: *agent-team-environment
      AGENT_TEAM_UI_HOSTS: ${AGENT_TEAM_UI_HOSTS:-agent-team.137-131-153-58.sslip.io}
    command: ["node", "--disable-warning=ExperimentalWarning", "src/cli.ts", "ui", "${AGENT_TEAM_HOME:-/home/opc}/agent-team-runs", "--port", "4400", "--host", "${AGENT_TEAM_UI_BIND:-172.17.0.1}"]

  doctor:
    <<: *agent-team
    command: ["node", "--disable-warning=ExperimentalWarning", "src/cli.ts", "doctor", "${AGENT_TEAM_HOME:-/home/opc}/agent-team-runs"]
