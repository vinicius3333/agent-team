<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent-team</title>
<style>
:root {
  --bg: #0a0b0f; --panel: #111318; --panel-2: #161922; --panel-3: #1c2030; --border: #242835; --border-2: #2e3344;
  --text: #e8eaf0; --muted: #8b90a0; --faint: #5d6273;
  --accent: #8b5cf6; --accent-2: #a78bfa; --accent-soft: rgba(139, 92, 246, .16);
  --blue: #3b82f6; --blue-soft: rgba(59, 130, 246, .15); --green: #22c55e; --green-soft: rgba(34, 197, 94, .14);
  --red: #ef4444; --red-soft: rgba(239, 68, 68, .14); --amber: #f59e0b; --amber-soft: rgba(245, 158, 11, .15);
  --gray: #6b7280; --gray-soft: rgba(107, 114, 128, .18); --teal: #14b8a6; --teal-soft: rgba(20, 184, 166, .15);
  --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f6f7fb; --panel: #ffffff; --panel-2: #f3f4f8; --panel-3: #eceef5; --border: #e3e5ec; --border-2: #d5d8e2;
    --text: #151823; --muted: #5d6273; --faint: #8b90a0;
    --accent: #7c3aed; --accent-2: #6d28d9; --accent-soft: rgba(124, 58, 237, .1);
    --blue: #2563eb; --green: #16a34a; --red: #dc2626; --amber: #b45309; --gray: #6b7280; --teal: #0f766e;
    color-scheme: light;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--font); }
body { overflow-x: hidden; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--mono); }
.muted { color: var(--muted); }

.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
.sidebar { border-right: 1px solid var(--border); padding: 20px 12px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; }
.brand { font-weight: 700; font-size: 20px; letter-spacing: -.02em; padding: 0 8px 18px; display: flex; align-items: center; gap: 8px; }
.brand-mark { width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(135deg, var(--accent), #3b82f6); }
.side-label { font-size: 12px; color: var(--muted); padding: 14px 8px 6px; }
.project { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; background: none; border-radius: 8px; cursor: pointer; text-align: left; }
.project:hover { background: var(--panel-2); }
.project.selected { background: var(--panel-3); }
.project .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.project .sub { font-size: 11px; color: var(--faint); }
.side-foot { margin-top: auto; font-size: 12px; color: var(--muted); padding: 8px; display: flex; align-items: center; gap: 8px; }

.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--gray); flex: none; }
.dot.running { background: var(--blue); box-shadow: 0 0 0 0 var(--blue); animation: pulse 1.6s infinite; }
.dot.merged, .dot.approved, .dot.done, .dot.ok { background: var(--green); }
.dot.blocked, .dot.failed { background: var(--red); }
.dot.awaiting_approval, .dot.paused { background: var(--amber); }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(59,130,246,.55); } 70% { box-shadow: 0 0 0 7px rgba(59,130,246,0); } 100% { box-shadow: 0 0 0 0 rgba(59,130,246,0); } }
@media (prefers-reduced-motion: reduce) { .dot.running { animation: none; } }

main { padding: 20px 24px 40px; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.header h1 { margin: 0; font-size: 26px; letter-spacing: -.02em; }
.pill { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px; }
.pill.live { background: var(--blue); color: #fff; }
.pill.idle { background: var(--panel-3); color: var(--muted); }
.header .meta { color: var(--muted); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.chip { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--panel-3); border: 1px solid var(--border); color: var(--muted); }
.switcher { display: none; }

.card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; min-width: 0; }
.card h2 { margin: 0 0 12px; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.card h2 .count { color: var(--muted); font-weight: 400; font-size: 13px; }

.stepper { display: flex; align-items: flex-start; padding: 18px 24px; }
.step { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; flex: 1; position: relative; min-width: 0; }
.step:last-child { flex: none; }
.step-row { display: flex; align-items: center; width: 100%; }
.step-icon { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex: none; border: 2px solid var(--border-2); color: var(--faint); font-size: 12px; font-weight: 700; background: var(--panel); }
.step-line { flex: 1; height: 2px; background: var(--border-2); margin: 0 8px; }
.step.approved .step-icon, .step.done .step-icon { background: var(--green); border-color: var(--green); color: #0a0b0f; }
.step.approved .step-line, .step.done .step-line { background: var(--green); }
.step.running .step-icon { border-color: var(--blue); background: var(--blue-soft); box-shadow: 0 0 0 4px var(--blue-soft); }
.step.running .step-icon::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--blue); }
.step.awaiting_approval .step-icon { border-color: var(--amber); color: var(--amber); background: var(--amber-soft); }
.step.failed .step-icon { border-color: var(--red); color: var(--red); background: var(--red-soft); }
.step.skipped .step-icon { border-style: dashed; color: var(--faint); }
.step-label { font-size: 13px; color: var(--muted); white-space: nowrap; }
.step.running .step-label { color: var(--text); font-weight: 600; }
.step-sub { font-size: 12px; color: var(--blue); margin-top: -4px; }
.step.skipped .step-sub { color: var(--faint); }
.step.awaiting_approval .step-sub { color: var(--amber); }

.grid-main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; }
.grid-bottom { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; }
.side-stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.column { background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px; min-height: 180px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.column-head { display: flex; align-items: center; gap: 8px; font-weight: 600; padding: 2px 2px 6px; }
.column-head .n { margin-left: auto; color: var(--muted); font-weight: 400; }
.task { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px; cursor: pointer; text-align: left; width: 100%; display: flex; flex-direction: column; gap: 6px; position: relative; }
.task:hover { border-color: var(--border-2); }
.task-top { display: flex; align-items: center; gap: 8px; }
.id-chip { font-family: var(--mono); font-size: 11px; padding: 1px 7px; border-radius: 6px; border: 1px solid var(--border-2); background: var(--panel-2); }
.task-top .dot { margin-left: auto; }
.task-title { font-weight: 600; font-size: 13px; overflow-wrap: anywhere; }
.task-foot { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.badge { font-size: 11px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--border-2); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.badge.running { color: var(--blue); background: var(--blue-soft); border-color: transparent; }
.badge.done, .badge.merged, .badge.approved, .badge.pass { color: var(--green); background: var(--green-soft); border-color: transparent; }
.badge.failed, .badge.blocked, .badge.fail { color: var(--red); background: var(--red-soft); border-color: transparent; }
.badge.timeout, .badge.awaiting_approval, .badge.warn { color: var(--amber); background: var(--amber-soft); border-color: transparent; }
.badge.aborted, .badge.pending { color: var(--muted); background: var(--gray-soft); border-color: transparent; }
.failure { font-size: 12px; color: var(--red); background: var(--red-soft); border-radius: 6px; padding: 6px 8px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 160px; overflow: auto; font-family: var(--mono); }
.empty { color: var(--faint); font-size: 12px; padding: 6px 2px; }

.log { font-family: var(--mono); font-size: 12px; max-height: 420px; overflow: auto; display: flex; flex-direction: column; gap: 2px; }
.log-row { display: grid; grid-template-columns: 64px 70px minmax(0, 1fr); gap: 10px; align-items: baseline; padding: 4px 2px; border-radius: 4px; }
.log-row:hover { background: var(--panel-2); }
.log-time { color: var(--faint); }
.tag { font-size: 11px; padding: 1px 7px; border-radius: 5px; text-align: center; background: var(--gray-soft); color: var(--muted); font-family: var(--font); font-weight: 600; }
.tag.phase { background: var(--accent-soft); color: var(--accent-2); }
.tag.task { background: var(--blue-soft); color: var(--blue); }
.tag.gate { background: var(--amber-soft); color: var(--amber); }
.tag.harness { background: var(--teal-soft); color: var(--teal); }
.tag.publish { background: var(--green-soft); color: var(--green); }
.tag.run { background: var(--gray-soft); color: var(--text); }
.log-msg { overflow-wrap: anywhere; white-space: pre-wrap; }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 9px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--panel-2); }
tbody tr:last-child td { border-bottom: 0; }

.health-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel-2); margin-bottom: 8px; }
.health-row .when { margin-left: auto; font-size: 12px; color: var(--muted); }
.list { list-style: none; margin: 0; padding: 0; font-family: var(--mono); font-size: 12px; display: flex; flex-direction: column; gap: 4px; max-height: 220px; overflow: auto; }
.list li { overflow-wrap: anywhere; padding: 3px 0; border-bottom: 1px dashed var(--border); }
.list li:last-child { border-bottom: 0; }
.list .hash { color: var(--accent-2); }

.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 12px; border-bottom: 1px solid var(--border); }
.tab { border: 0; background: none; padding: 8px 12px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab.selected { color: var(--text); border-bottom-color: var(--accent); }
.artifact { font-family: var(--mono); font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--panel-2); border-radius: 8px; padding: 14px; max-height: 560px; overflow: auto; margin: 0; }
.artifact .h { color: var(--accent-2); font-weight: 700; }
.mockups { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; white-space: normal; font-family: var(--font); }
.mockups a { display: flex; flex-direction: column; gap: 6px; color: inherit; text-decoration: none; }
.mockups img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; object-position: top; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); }
.mockups span { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }


/* Live preview */
.preview-button { display: inline-flex; align-items: center; gap: 8px; margin-left: auto; padding: 8px 14px; border-radius: 9px; background: var(--accent); color: #fff; font-weight: 600; font-size: 13px; text-decoration: none; white-space: nowrap; }
.preview-button:hover { filter: brightness(1.1); }
.preview-button:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }
.preview-button .dot { box-shadow: 0 0 0 2px rgba(255, 255, 255, .6); }
.preview-button.wide { margin: 0; justify-content: center; }
.project .globe { margin-left: auto; font-size: 13px; line-height: 1; }

/* Markdown documents */
.doc-toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.doc-toolbar select { flex: 1 1 200px; min-width: 0; max-width: 360px; background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; font: inherit; font-size: 13px; }
.toggle { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.toggle button { border: 0; background: var(--panel-2); color: var(--muted); padding: 6px 10px; font-size: 12px; cursor: pointer; }
.toggle button.selected { background: var(--accent); color: #fff; }
.doc-actions { display: inline-flex; gap: 6px; margin-left: auto; }
.artifact.rich { font-family: var(--font); font-size: 14px; white-space: normal; padding: 0; background: none; max-height: none; overflow: visible; }
.doc { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 20px; align-items: start; }
.doc.no-toc { grid-template-columns: minmax(0, 1fr); }
.doc-toc { position: sticky; top: 8px; max-height: 70vh; overflow: auto; font-size: 12px; border-right: 1px solid var(--border); padding-right: 10px; }
.doc-toc summary { cursor: pointer; color: var(--muted); font-weight: 600; margin-bottom: 6px; list-style: none; }
.doc-toc ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.doc-toc button { background: none; border: 0; color: var(--muted); text-align: left; padding: 3px 6px; border-radius: 6px; cursor: pointer; width: 100%; font-size: 12px; }
.doc-toc button:hover, .doc-toc button:focus-visible { color: var(--text); background: var(--panel-2); }
.doc-toc .l3 { padding-left: 14px; }
.doc-scroll { background: var(--panel-2); border-radius: 10px; padding: 18px 22px; max-height: 620px; overflow: auto; }
.doc-source { font-family: var(--mono); font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
.md { max-width: 75ch; line-height: 1.65; color: var(--text); overflow-wrap: anywhere; }
.md > :first-child { margin-top: 0; }
.md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { line-height: 1.3; margin: 1.4em 0 .5em; scroll-margin-top: 12px; }
.md h1 { font-size: 1.6em; } .md h2 { font-size: 1.3em; padding-bottom: .25em; border-bottom: 1px solid var(--border); } .md h3 { font-size: 1.1em; } .md h4, .md h5, .md h6 { font-size: 1em; color: var(--muted); }
.md-anchor { opacity: 0; margin-left: 6px; border: 0; background: none; color: var(--accent-2); cursor: pointer; font: inherit; }
.md-heading:hover .md-anchor, .md-anchor:focus-visible { opacity: 1; }
.md p, .md ul, .md ol, .md blockquote, .md .md-table, .md .md-code { margin: 0 0 .9em; }
.md ul, .md ol { padding-left: 1.4em; }
.md li + li { margin-top: .2em; }
.md li > ul, .md li > ol { margin: .25em 0 0; }
.md li.task { list-style: none; margin-left: -1.3em; }
.md-check { display: inline-grid; place-items: center; width: 15px; height: 15px; border: 1.5px solid var(--faint); border-radius: 4px; margin-right: 8px; font-size: 10px; vertical-align: -2px; }
.md-check.done { background: var(--green); border-color: var(--green); color: #fff; }
.md a, .md-link { color: var(--accent-2); text-decoration: underline; text-underline-offset: 2px; }
.md-link { background: none; border: 0; padding: 0; font: inherit; cursor: pointer; }
.md code { font-family: var(--mono); font-size: .88em; background: var(--bg); border: 1px solid var(--border); border-radius: 5px; padding: .08em .35em; }
.md-code { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--bg); }
.md-code-head { display: flex; align-items: center; justify-content: space-between; padding: 6px 10px; font-family: var(--mono); font-size: 11px; color: var(--muted); border-bottom: 1px solid var(--border); }
.md-code pre { margin: 0; padding: 12px; overflow: auto; font-size: 12.5px; line-height: 1.5; }
.md-code pre code { background: none; border: 0; padding: 0; font-size: inherit; }
.md blockquote { border-left: 3px solid var(--accent); padding: .2em 0 .2em 1em; color: var(--muted); }
.md hr { border: 0; border-top: 1px solid var(--border); margin: 1.5em 0; }
.md img { max-width: 100%; border-radius: 8px; border: 1px solid var(--border); }
.md-table { overflow-x: auto; }
.md table { border-collapse: collapse; font-size: .92em; min-width: 50%; }
.md th, .md td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; vertical-align: top; }
.md th { background: var(--panel); font-weight: 600; }
.bubble.md { white-space: normal; max-width: none; }
.bubble.md p:last-child { margin-bottom: 0; }
.card.reader { position: fixed; inset: 0; z-index: 30; margin: 0; border-radius: 0; overflow: auto; padding: 20px max(16px, calc((100vw - 1100px) / 2)); }
.card.reader .doc-scroll { max-height: none; background: none; padding: 0; }
.card.reader .md { font-size: 16px; }
@media (max-width: 720px) {
  .doc { grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .doc-toc { position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--border); padding: 0 0 8px; }
  .doc-scroll { padding: 14px; }
  .doc-actions { margin-left: 0; }
}

.segmented { display: none; }

/* Drawer */
.scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .55); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; }
.scrim.open { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(600px, 100vw); background: var(--panel); border-left: 1px solid var(--border); transform: translateX(100%); transition: transform .22s ease; z-index: 21; display: flex; flex-direction: column; }
.drawer.open { transform: none; }
.drawer-head { padding: 18px 20px 12px; border-bottom: 1px solid var(--border); display: flex; gap: 12px; align-items: flex-start; }
.drawer-head h3 { margin: 0; font-size: 17px; overflow-wrap: anywhere; }
.drawer-head .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
.icon-button { margin-left: auto; border: 1px solid var(--border); background: var(--panel-2); border-radius: 8px; width: 34px; height: 34px; cursor: pointer; flex: none; font-size: 18px; line-height: 1; }
.drawer-tabs { padding: 0 20px; }
.drawer-body { flex: 1; overflow: auto; padding: 16px 20px 28px; }
.timeline { position: relative; display: flex; flex-direction: column; gap: 14px; }
.timeline::before { content: ""; position: absolute; left: 7px; top: 6px; bottom: 6px; width: 2px; background: var(--border); }
.event { position: relative; padding-left: 28px; display: flex; flex-direction: column; gap: 8px; }
.event::before { content: ""; position: absolute; left: 1px; top: 4px; width: 14px; height: 14px; border-radius: 50%; background: var(--blue); border: 3px solid var(--panel); }
.event.review::before { background: var(--accent); }
.event.error::before { background: var(--red); }
.event-label { font-weight: 600; font-size: 13px; }
.bubble { background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; }
.command { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.command-head { display: flex; align-items: center; gap: 8px; padding: 8px 12px; font-family: var(--mono); font-size: 12px; }
.command-head code { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.command-head code::before { content: "$ "; color: var(--faint); }
.command details summary { cursor: pointer; padding: 0 12px 8px; font-size: 12px; color: var(--muted); }
.command pre { margin: 0; padding: 0 12px 12px; font-size: 11px; max-height: 280px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--muted); }
.file-row { display: flex; align-items: center; gap: 10px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; font-family: var(--mono); font-size: 12px; }
.file-kind { font-weight: 700; width: 14px; }
.file-kind.add { color: var(--green); } .file-kind.update { color: var(--amber); } .file-kind.delete { color: var(--red); }
.file-row .path { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.verdict { border-radius: 10px; border: 1px solid; overflow: hidden; }
.verdict.pass { border-color: rgba(34,197,94,.45); }
.verdict.fail { border-color: rgba(239,68,68,.45); }
.verdict-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; font-size: 20px; font-weight: 700; letter-spacing: .02em; }
.verdict.pass .verdict-head { background: var(--green-soft); color: var(--green); }
.verdict.fail .verdict-head { background: var(--red-soft); color: var(--red); }
.verdict ul { margin: 0; padding: 10px 14px 12px 34px; font-size: 13px; }
.verdict h4 { margin: 8px 14px 0; font-size: 12px; color: var(--muted); font-weight: 600; }
.stat-row { display: flex; flex-wrap: wrap; gap: 8px; }
.raw { font-family: var(--mono); font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }

/* Details panel */
.details-scrim { z-index: 17; }
.drawer.details { z-index: 18; width: min(520px, 100vw); }
.details-body { display: flex; flex-direction: column; gap: 18px; }
.section-title { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 0 0 8px; }
.kv { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 6px 12px; font-size: 13px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.path-list { display: flex; flex-wrap: wrap; gap: 6px; }
.path-list code { font-family: var(--mono); font-size: 12px; padding: 2px 7px; border-radius: 6px; background: var(--panel-2); border: 1px solid var(--border); overflow-wrap: anywhere; }
.checklist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.checklist li { display: flex; gap: 8px; align-items: flex-start; }
.checklist .box { width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--border-2); flex: none; margin-top: 2px; display: grid; place-items: center; font-size: 11px; color: #0a0b0f; }
.checklist .box.checked { background: var(--green); border-color: var(--green); }
.verify { display: flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-family: var(--mono); font-size: 12px; }
.verify code { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.small-button { border: 1px solid var(--border); background: var(--panel-2); border-radius: 6px; padding: 3px 9px; cursor: pointer; font-size: 12px; white-space: nowrap; }
.small-button:hover { border-color: var(--border-2); }
.link-button { border: 0; background: none; padding: 0; color: var(--accent-2); cursor: pointer; font: inherit; text-decoration: underline; text-underline-offset: 2px; }
.links { display: flex; flex-wrap: wrap; gap: 8px; }
.links a { color: var(--accent-2); font-size: 13px; text-decoration: none; border: 1px solid var(--border); border-radius: 8px; padding: 5px 10px; background: var(--panel-2); display: inline-flex; gap: 6px; align-items: center; }
.links a:hover { border-color: var(--accent); }
.calls { display: flex; flex-direction: column; gap: 6px; }
.call { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; width: 100%; text-align: left; border: 1px solid var(--border); background: var(--panel-2); border-radius: 8px; padding: 8px 10px; cursor: pointer; font-size: 12px; }
.call:hover { border-color: var(--border-2); }
.call .what { font-weight: 600; font-size: 13px; }
.call .detail { grid-column: 2 / -1; color: var(--muted); font-family: var(--mono); overflow-wrap: anywhere; }
.attempt-group { font-size: 12px; color: var(--faint); margin: 6px 0 2px; }
details.collapsible summary { cursor: pointer; color: var(--muted); font-size: 13px; }
details.collapsible[open] summary { margin-bottom: 8px; }
.step { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; font: inherit; color: inherit; }
.step:hover .step-label { color: var(--text); }
.log-row { cursor: pointer; }
.health-row { cursor: pointer; width: 100%; text-align: left; font: inherit; color: inherit; }
.health-row:hover { border-color: var(--border-2); }
.list li[data-container] { cursor: pointer; }
.list li[data-container]:hover { color: var(--text); }

@media (max-width: 1180px) {
  .grid-main, .grid-bottom { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 720px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .sidebar { display: none; }
  main { padding: 14px 16px 32px; gap: 12px; }
  .switcher { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; }
  .switcher select { flex: 1; min-width: 0; background: transparent; border: 0; color: var(--text); font: 600 16px var(--font); }
  .top-brand { display: flex; align-items: center; justify-content: space-between; }
  .header h1 { font-size: 20px; }
  .header .desktop-only { display: none; }
  .stepper { padding: 14px 10px; overflow-x: auto; }
  .step-label { font-size: 11px; }
  .step-icon { width: 24px; height: 24px; }
  .step-line { margin: 0 4px; }
  .segmented { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 4px; position: sticky; top: 0; z-index: 5; }
  .segmented button { border: 1px solid transparent; background: none; border-radius: 9px; padding: 9px 4px; cursor: pointer; color: var(--muted); font-size: 13px; }
  .segmented button.selected { background: var(--accent-soft); border-color: var(--accent); color: var(--text); }
  [data-section] { display: none; }
  [data-section].visible { display: block; }
  .grid-main, .grid-bottom, .side-stack { display: contents; }
  .board { grid-template-columns: minmax(0, 1fr); }
  .column { min-height: 0; background: none; border: 0; padding: 0; }
  .column-head { display: none; }
  .column .empty { display: none; }
  .task { border-left: 4px solid var(--gray); padding: 12px 14px; }
  .task.running { border-left-color: var(--blue); }
  .task.merged { border-left-color: var(--green); }
  .task.blocked { border-left-color: var(--red); }
  .task.awaiting_approval { border-left-color: var(--amber); }
  .log-row { grid-template-columns: 58px minmax(0, 1fr); }
  .log-row .tag { grid-column: 2; justify-self: start; }
  .log-row .log-msg { grid-column: 1 / -1; }
  .drawer, .drawer.details { width: 100vw; border-left: 0; }
  .kv { grid-template-columns: 100px minmax(0, 1fr); }
}
@media (min-width: 721px) { .mobile-only { display: none !important; } }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" aria-label="Projects">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span>agent-team</div>
    <div class="side-label">Projects</div>
    <nav id="projects"></nav>
    <div class="side-foot"><span class="dot ok" id="server-dot"></span><span id="server-state">Server online</span></div>
  </aside>
  <main id="main">
    <div class="top-brand mobile-only"><div class="brand" style="padding:0"><span class="brand-mark" aria-hidden="true"></span>agent-team</div></div>
    <label class="switcher mobile-only"><span aria-hidden="true">▤</span><span class="sr" style="position:absolute;left:-9999px">Project</span><select id="switcher"></select><span id="switcher-live"></span></label>
    <div id="content"><p class="muted">Loading projects…</p></div>
  </main>
</div>
<div class="scrim details-scrim" id="details-scrim"></div>
<aside class="drawer details" id="details" aria-hidden="true" aria-labelledby="details-title" aria-modal="true" role="dialog">
  <div class="drawer-head">
    <div style="min-width:0"><h3 id="details-title"></h3><div class="sub" id="details-sub"></div></div>
    <button class="icon-button" id="details-close" aria-label="Close details">×</button>
  </div>
  <div class="drawer-body details-body" id="details-body"></div>
</aside>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true" aria-labelledby="drawer-title" aria-modal="true" role="dialog">
  <div class="drawer-head">
    <div style="min-width:0"><h3 id="drawer-title"></h3><div class="sub" id="drawer-sub"></div></div>
    <button class="icon-button" id="drawer-close" aria-label="Close transcript">×</button>
  </div>
  <div class="tabs drawer-tabs" role="tablist">
    <button class="tab selected" data-drawer-tab="timeline">Transcript</button>
    <button class="tab" data-drawer-tab="raw">Raw</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>
<script>
const steps = ["spec", "architecture", "mockups", "design", "plan", "build", "deploy"]
const stepLabels = { spec: "Spec", architecture: "Architecture", mockups: "Mockups", design: "Design", plan: "Plan", build: "Build", deploy: "Deploy" }
const columns = [["pending", "Pending"], ["running", "Running"], ["merged", "Merged"], ["blocked", "Blocked"]]
const artifacts = ["input.md", "docs/spec.md", "docs/architecture.md", "mockups", "docs/design.md", "tasks.json"]
const state = { projects: [], selected: null, detail: null, stream: null, artifact: "input.md", logPinned: true, section: "tasks", transcript: null, drawerTab: "timeline", panel: null, docMode: "rendered", reader: false, markdownFiles: [], docCache: {} }
const phaseRoles = { spec: "pm", architecture: "architect", mockups: "illustrator", design: "designer", plan: "planner" }
const phaseOutputs = { spec: ["docs/spec.md"], architecture: ["docs/architecture.md", "docs/adr/", "contracts/openapi.yaml"], mockups: ["design/mockups/*.png", "design/mockups/README.md"], design: ["docs/design.md", "design/tokens.css"], plan: ["tasks.json"], build: ["code and tests, one merge per task"] }
const phaseArtifacts = { spec: "docs/spec.md", architecture: "docs/architecture.md", mockups: "mockups", design: "docs/design.md", plan: "tasks.json" }

const escape = (value) => String(value ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c])
const time = (iso) => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false }) }
const duration = (ms) => { if (ms == null) return "—"; const s = Math.round(ms / 1000); return s < 60 ? `${s}s` : s < 3600 ? `${Math.floor(s / 60)}m ${s % 60}s` : `${Math.floor(s / 3600)}h ${Math.floor((s % 3600) / 60)}m` }

function projectStatus(project) {
  if (project.counts?.blocked) return "blocked"
  if (project.phases?.some((p) => p.status === "awaiting_approval")) return "awaiting_approval"
  if (project.active) return "running"
  const phasesDone = project.phases?.length && project.phases.every((p) => p.status === "approved")
  const total = Object.values(project.counts ?? {}).reduce((a, b) => a + b, 0)
  if (phasesDone && total && project.counts.merged === total) return "merged"
  if (project.phases?.some((p) => p.status === "failed")) return "failed"
  return "pending"
}

async function loadProjects() {
  try {
    state.projects = await fetch("api/projects").then((r) => { if (!r.ok) throw new Error(); return r.json() })
    document.getElementById("server-dot").className = "dot ok"
    document.getElementById("server-state").textContent = "Server online"
  } catch {
    document.getElementById("server-dot").className = "dot failed"
    document.getElementById("server-state").textContent = "Server unreachable"
    return
  }
  document.getElementById("projects").innerHTML = state.projects.map((p) => {
    const status = projectStatus(p)
    const sub = p.current ? `${p.current}` : status.replace("_", " ")
    return `<button class="project ${p.name === state.selected ? "selected" : ""}" data-name="${escape(p.name)}"><span class="dot ${status}"></span><span class="name">${escape(p.name)}<div class="sub">${escape(sub)}</div></span>${p.live ? `<span class="globe" title="Live preview${p.liveUrl ? `: ${escape(p.liveUrl)}` : ""}" aria-label="Live">🌐</span>` : ""}</button>`
  }).join("") || `<div class="empty">No projects in the runs directory.</div>`
  const switcher = document.getElementById("switcher")
  switcher.innerHTML = state.projects.map((p) => `<option value="${escape(p.name)}" ${p.name === state.selected ? "selected" : ""}>${escape(p.name)}</option>`).join("")
  if (!state.selected && state.projects.length) {
    const fromHash = parseHash()
    const initial = state.projects.find((p) => p.name === fromHash.project) ?? state.projects.find((p) => p.active) ?? state.projects[0]
    if (initial.name === fromHash.project && fromHash.panel) state.panel = fromHash.panel
    select(initial.name, { keepPanel: true })
  }
}

function parseHash() {
  const [project = "", ...pairs] = location.hash.slice(1).split("&")
  const params = Object.fromEntries(pairs.map((pair) => pair.split("=").map(decodeURIComponent)))
  const kind = ["task", "phase", "runner", "container", "doc"].find((key) => params[key])
  return { project: decodeURIComponent(project), panel: kind ? { kind, id: params[kind] } : null }
}

function writeHash() {
  if (!state.selected) return
  const panel = state.panel && state.panel.kind !== "event" ? `&${state.panel.kind}=${encodeURIComponent(state.panel.id)}` : ""
  history.replaceState(null, "", `#${encodeURIComponent(state.selected)}${panel}`)
}

function select(name, options = {}) {
  if (state.selected === name && state.stream) return
  state.selected = name
  state.detail = null
  state.logPinned = true
  if (!options.keepPanel) closeDetails()
  writeHash()
  document.querySelectorAll(".project").forEach((el) => el.classList.toggle("selected", el.dataset.name === name))
  document.getElementById("switcher").value = name
  document.getElementById("content").innerHTML = `<p class="muted">Loading ${escape(name)}…</p>`
  state.stream?.close()
  state.stream = new EventSource(`api/stream/${encodeURIComponent(name)}`)
  state.stream.onmessage = (event) => {
    const first = !state.detail
    state.detail = JSON.parse(event.data)
    render()
    if (first && state.panel && !document.getElementById("details").classList.contains("open")) openDetails(state.panel)
  }
}

function skippedPhases(detail) {
  const skipped = new Set()
  for (const event of detail.events) {
    const match = /^(\w+) skipped/.exec(event.message)
    if (event.type === "phase" && match) skipped.add(match[1])
  }
  return skipped
}

function countTasks(tasks) {
  const counts = { pending: 0, running: 0, merged: 0, blocked: 0 }
  for (const task of tasks) counts[task.status in counts ? task.status : "pending"]++
  return counts
}

// The deploy phase row wins when the orchestrator writes one; otherwise it is derived from the containers and deploy events.
function deployState(detail) {
  const row = detail.phases.find((p) => p.name === "deploy")?.status
  const deploy = detail.deploy
  const lastEvent = detail.events.filter((e) => e.type === "deploy").at(-1)
  if (row) {
    const sub = row === "approved" ? (deploy?.status === "live" ? "live" : "deployed") : row === "running" ? "starting" : row === "skipped" ? "skipped" : row === "failed" ? "failed" : ""
    return { status: row, sub }
  }
  if (deploy?.status === "live") return { status: "approved", sub: "live" }
  if (lastEvent && /^failed/.test(lastEvent.message)) return { status: "failed", sub: "failed" }
  if (lastEvent && /^skipped/.test(lastEvent.message)) return { status: "skipped", sub: "skipped" }
  if (deploy?.status === "starting" || (lastEvent && /^starting/.test(lastEvent.message))) return { status: "running", sub: "starting" }
  if (deploy?.status === "stopped") return { status: "pending", sub: "stopped" }
  return { status: "pending", sub: "" }
}

function stepperHtml(detail) {
  const byName = Object.fromEntries(detail.phases.map((p) => [p.name, p.status]))
  const skipped = skippedPhases(detail)
  const counts = countTasks(detail.tasks)
  const total = detail.tasks.length
  return `<section class="card stepper" aria-label="Pipeline">${steps.map((step, index) => {
    let status = byName[step] ?? "pending"
    let sub = ""
    if (step === "build") {
      status = !total ? "pending" : counts.merged === total ? "done" : counts.blocked ? "failed" : counts.running || detail.phases.every((p) => p.status === "approved") ? "running" : "pending"
      if (total) sub = `${counts.merged}/${total} tasks`
    } else if (step === "deploy") {
      ({ status, sub } = deployState(detail))
    } else if (skipped.has(step)) { status = "skipped"; sub = "skipped" }
    else if (status === "awaiting_approval") sub = "needs approval"
    else if (status === "running") sub = "working"
    const icon = status === "approved" || status === "done" ? "✓" : status === "failed" ? "!" : status === "running" ? "" : status === "skipped" ? "–" : index + 1
    const last = index === steps.length - 1
    return `<button class="step ${status}" data-phase="${step}" aria-label="${stepLabels[step]}: ${escape(sub || status)}. Show details"><div class="step-row"><span class="step-icon" aria-hidden="true">${icon}</span>${last ? "" : `<span class="step-line"></span>`}</div><span class="step-label">${stepLabels[step]}</span>${sub ? `<span class="step-sub">${escape(sub)}</span>` : ""}</button>`
  }).join("")}</section>`
}

function boardHtml(detail) {
  const counts = countTasks(detail.tasks)
  const maxRetries = maxRetriesOf(detail)
  return `<section class="card" data-section="tasks"><h2>Tasks <span class="count">${detail.tasks.length} total</span></h2>
    ${detail.tasks.length ? `<div class="board">${columns.map(([key, label]) => {
      const tasks = detail.tasks.filter((t) => (t.status in counts ? t.status : "pending") === key)
      return `<div class="column"><div class="column-head"><span class="dot ${key}"></span>${label}<span class="n">${tasks.length}</span></div>
        ${tasks.map((t) => `<button class="task ${key}" data-task="${escape(t.id)}" aria-label="${escape(t.id)} ${escape(t.title)}. Show details">
          <div class="task-top"><span class="id-chip">${escape(t.id)}</span><span class="dot ${key}"></span></div>
          <div class="task-title">${escape(t.title)}</div>
          <div class="task-foot">${t.phase ? `<span>${escape(t.phase)}</span>` : ""}${t.attempts ? `<span class="badge ${t.status === "blocked" ? "blocked" : ""}">${t.attempts}/${maxRetries}</span>` : ""}${t.dependsOn?.length ? `<span class="muted">after ${escape(t.dependsOn.join(", "))}</span>` : ""}</div>
          ${t.lastFailure ? `<div class="muted" style="font-size:11px">Last attempt failed · open for details</div>` : ""}
        </button>`).join("") || `<div class="empty">Nothing here</div>`}</div>`
    }).join("")}</div>` : `<div class="empty">Tasks appear after the plan phase writes tasks.json.</div>`}</section>`
}

function logHtml(detail) {
  return `<section class="card" data-section="activity"><h2>Live activity <span class="count">${detail.events.length}</span></h2>
    <div class="log" id="log">${detail.events.map((e) => `<div class="log-row" data-event="${escape(e.id)}" tabindex="0" role="button" aria-label="Event details"><span class="log-time">${time(e.at)}</span><span class="tag ${escape(e.type)}">${escape(e.type)}</span><span class="log-msg">${escape(e.message)}</span></div>`).join("") || `<div class="empty">No activity yet.</div>`}</div></section>`
}

function attemptsHtml(detail) {
  return `<section class="card" data-section="agents"><h2>Agent calls <span class="count">${detail.attempts.length}</span></h2>
    ${detail.attempts.length ? `<div class="table-wrap"><table><thead><tr><th>Subject</th><th>Role</th><th>Runner</th><th>Model</th><th>Duration</th><th>Status</th><th>Failure class</th><th>Cost</th></tr></thead><tbody>
    ${detail.attempts.map((a) => `<tr data-transcript="${escape(a.transcript)}" data-subject="${escape(a.subject)}" data-role="${escape(a.role)}" data-runner="${escape(a.runner)}" data-model="${escape(a.model)}" tabindex="0">
      <td class="mono">${escape(a.subject)}</td><td>${escape(a.role)}</td><td>${escape(a.runner)}</td><td class="mono">${escape(a.model)}</td><td>${duration(a.durationMs)}</td>
      <td><span class="badge ${escape(a.status)}"><span class="dot ${a.status === "done" ? "ok" : a.status}"></span>${escape(a.status)}</span></td>
      <td>${a.failureClass ? `<span class="badge ${a.failureClass === "agent_failure" ? "warn" : "fail"}">${escape(a.failureClass)}</span>` : `<span class="muted">—</span>`}</td>
      <td class="mono">${a.costUsd ? `$${a.costUsd.toFixed(3)}` : "—"}</td></tr>`).join("")}
    </tbody></table></div>` : `<div class="empty">No agent calls yet.</div>`}</section>`
}

function healthHtml(detail) {
  const now = Date.now()
  const cooling = Object.fromEntries(detail.cooldowns.filter((c) => c.until > now).map((c) => [c.runner, c]))
  const runners = [...new Set(["claude", "codex", ...detail.attempts.map((a) => a.runner)])]
  return `<section class="card" data-section="agents"><h2>Runner health</h2>
    ${runners.map((r) => cooling[r]
      ? `<button class="health-row" data-runner="${escape(r)}"><span class="dot awaiting_approval"></span><span class="mono">${escape(r)}</span><span class="badge warn">${escape(cooling[r].reason)}</span><span class="when">until ${time(new Date(cooling[r].until).toISOString())}</span></button>`
      : `<button class="health-row" data-runner="${escape(r)}"><span class="dot ok"></span><span class="mono">${escape(r)}: healthy</span></button>`).join("")}
    <h2 style="margin-top:16px">Containers <span class="count">${detail.containers.length}</span></h2>
    ${detail.containers.length ? `<ul class="list">${detail.containers.map((c) => `<li data-container="${escape(c.name)}" tabindex="0" role="button"><span class="dot running" style="display:inline-block;margin-right:6px"></span>${escape(c.name)} · ${escape(c.runningFor)}</li>`).join("")}</ul>` : `<div class="empty">No agent containers running.</div>`}
    <h2 style="margin-top:16px">Worktrees <span class="count">${Math.max(0, detail.worktrees.length - 1)}</span></h2>
    <ul class="list">${detail.worktrees.map((w) => `<li>${escape(w)}</li>`).join("")}</ul></section>`
}

function gitHtml(detail) {
  return `<section class="card" data-section="files"><h2>Git log <span class="count">main</span></h2>
    <ul class="list">${detail.gitLog.map((line) => { const [hash, ...rest] = line.split(" "); return `<li><span class="hash">${escape(hash)}</span> ${escape(rest.join(" "))}</li>` }).join("") || `<li class="empty">No commits</li>`}</ul></section>`
}

function artifactsHtml(previous) {
  const extra = state.markdownFiles.filter((file) => !artifacts.includes(file))
  const isMarkdown = /\.md$/i.test(state.artifact)
  const option = (file) => `<option value="${escape(file)}" ${file === state.artifact ? "selected" : ""}>${escape(file)}</option>`
  return `<section class="card ${state.reader ? "reader" : ""}" data-section="files" id="docs-card" ${state.reader ? 'role="dialog" aria-modal="true" aria-label="Document reader"' : ""}><h2>Documents</h2>
    <div class="tabs" role="tablist">${artifacts.map((a) => `<button class="tab ${a === state.artifact ? "selected" : ""}" data-artifact="${a}" role="tab" aria-selected="${a === state.artifact}">${a === "mockups" ? "Mockups" : a.split("/").pop()}</button>`).join("")}</div>
    <div class="doc-toolbar">
      <select id="doc-picker" aria-label="Open a file">${artifacts.map(option).join("")}${extra.length ? `<optgroup label="All Markdown files">${extra.map(option).join("")}</optgroup>` : ""}</select>
      ${isMarkdown ? `<div class="toggle" role="group" aria-label="View mode"><button data-doc-mode="rendered" class="${state.docMode === "rendered" ? "selected" : ""}" aria-pressed="${state.docMode === "rendered"}">Rendered</button><button data-doc-mode="source" class="${state.docMode === "source" ? "selected" : ""}" aria-pressed="${state.docMode === "source"}">Source</button></div>` : ""}
      <span class="doc-actions">${isMarkdown ? `<button class="small-button" data-open-doc-panel="${escape(state.artifact)}">Open in panel</button>` : ""}<button class="small-button" data-doc-reader aria-pressed="${state.reader}">${state.reader ? "Close reader" : "Expand"}</button></span>
    </div>
    <div class="artifact ${state.artifact === "mockups" || (isMarkdown && state.docMode === "rendered") ? "rich" : ""}" id="artifact">${previous || "Loading…"}</div></section>`
}

function markdownDocument(text, path, options = {}) {
  const { html, headings } = markdown.render(text, { project: state.selected, path })
  const toc = headings.filter((h) => h.level <= 3)
  const tocHtml = toc.length > 2 && !options.compact
    ? `<nav class="doc-toc" aria-label="Table of contents"><details open><summary>Contents</summary><ul>${toc.map((h) => `<li><button class="l${h.level}" data-md-anchor="${h.id}">${escape(h.text)}</button></li>`).join("")}</ul></details></nav>`
    : ""
  return `<div class="doc ${tocHtml ? "" : "no-toc"}">${tocHtml}<div class="doc-scroll"><article class="md">${html || '<p class="muted">Empty document.</p>'}</article></div></div>`
}

function headerHtml(detail) {
  const first = detail.events[0]?.at
  const last = detail.events.at(-1)?.at
  const elapsed = first && last ? duration(Date.parse(detail.active ? new Date().toISOString() : last) - Date.parse(first)) : null
  const cost = detail.attempts.reduce((sum, a) => sum + (a.costUsd ?? 0), 0)
  return `<div class="header"><h1>${escape(detail.name)}</h1>
    <span class="pill ${detail.active ? "live" : "idle"}">${detail.active ? "● LIVE" : "IDLE"}</span>
    <span class="meta">${elapsed ? `<span>Elapsed ${elapsed}</span>` : ""}<span class="chip" title="Reported by Claude; Codex reports no cost">Cost $${cost.toFixed(2)}</span>
    ${detail.current ? `<span class="chip desktop-only">Now: ${escape(detail.current)}</span>` : ""}</span>
    ${detail.deploy?.url ? `<a class="preview-button" href="${escape(detail.deploy.url)}" target="_blank" rel="noopener noreferrer" title="${escape(detail.deploy.url)}"><span class="dot ${detail.deploy.status === "live" ? "merged" : "blocked"}" aria-hidden="true"></span>Open live preview ↗</a>` : ""}</div>`
}

function segmentedHtml() {
  return `<div class="segmented" role="tablist">${[["tasks", "Tasks"], ["activity", "Activity"], ["agents", "Agents"], ["files", "Files"]].map(([key, label]) => `<button data-segment="${key}" class="${state.section === key ? "selected" : ""}" role="tab" aria-selected="${state.section === key}">${label}</button>`).join("")}</div>`
}

function render() {
  const detail = state.detail
  if (!detail) return
  const log = document.getElementById("log")
  if (log) state.logPinned = log.scrollHeight - log.scrollTop - log.clientHeight < 40
  const previousArtifact = document.getElementById("artifact")?.innerHTML ?? ""
  const docScroll = { card: document.getElementById("docs-card")?.scrollTop ?? 0, body: document.querySelector("#artifact .doc-scroll")?.scrollTop ?? 0, toc: document.querySelector("#artifact .doc-toc")?.scrollTop ?? 0 }
  document.getElementById("switcher-live").innerHTML = detail.active ? `<span class="pill live">● LIVE</span>` : ""
  document.getElementById("content").innerHTML = `<div style="display:flex;flex-direction:column;gap:16px">
    ${headerHtml(detail)}
    ${stepperHtml(detail)}
    ${segmentedHtml()}
    <div class="grid-main">${boardHtml(detail)}<div class="side-stack">${logHtml(detail)}</div></div>
    <div class="grid-bottom">${attemptsHtml(detail)}<div class="side-stack">${healthHtml(detail)}</div></div>
    <div class="grid-bottom">${artifactsHtml(previousArtifact)}<div class="side-stack">${gitHtml(detail)}</div></div>
  </div>`
  document.querySelectorAll("[data-section]").forEach((el) => el.classList.toggle("visible", el.dataset.section === state.section))
  const newLog = document.getElementById("log")
  if (newLog && state.logPinned) newLog.scrollTop = newLog.scrollHeight
  const card = document.getElementById("docs-card")
  if (card) card.scrollTop = docScroll.card
  const bodyScroll = document.querySelector("#artifact .doc-scroll")
  if (bodyScroll) bodyScroll.scrollTop = docScroll.body
  const tocScroll = document.querySelector("#artifact .doc-toc")
  if (tocScroll) tocScroll.scrollTop = docScroll.toc
  if (!previousArtifact) loadArtifact()
  if (state.panel) renderDetails()
}

async function loadArtifact() {
  if (!state.selected) return
  const project = state.selected
  loadMarkdownList(project)
  if (state.artifact === "mockups") return loadMockups()
  const path = state.artifact
  const response = await fetch(`api/projects/${encodeURIComponent(project)}/file?path=${encodeURIComponent(path)}`)
  const text = response.ok ? await response.text() : null
  if (text !== null) state.docCache[path] = text
  const el = document.getElementById("artifact")
  if (!el || project !== state.selected || path !== state.artifact) return
  const rich = /\.md$/i.test(path) && state.docMode === "rendered" && text !== null
  el.classList.toggle("rich", rich)
  if (text === null) el.innerHTML = `<span class="muted">Not written yet (${escape(path)})</span>`
  else if (path.endsWith(".json")) el.innerHTML = escape(prettyJson(text))
  else el.innerHTML = rich ? markdownDocument(text, path) : `<pre class="doc-source">${escape(text)}</pre>`
  if (rich && path.startsWith("design/mockups/")) appendMockupGallery(el.querySelector(".md"), project)
}

// The mockups README lists file names; show the images it describes under the text.
async function appendMockupGallery(article, project) {
  if (!article) return
  const base = `api/projects/${encodeURIComponent(project)}/mockups`
  const images = await fetch(base).then((r) => (r.ok ? r.json() : [])).catch(() => [])
  if (!images.length || !article.isConnected) return
  article.insertAdjacentHTML("beforeend", `<h2>Images</h2><div class="mockups">${images.map((image) => `<a href="${base}/${encodeURIComponent(image)}" target="_blank" rel="noopener"><img src="${base}/${encodeURIComponent(image)}" alt="Mockup ${escape(image)}" loading="lazy"><span>${escape(image)}</span></a>`).join("")}</div>`)
}

async function loadMarkdownList(project) {
  const files = await fetch(`api/projects/${encodeURIComponent(project)}/markdown`).then((r) => (r.ok ? r.json() : [])).catch(() => [])
  if (project !== state.selected || JSON.stringify(files) === JSON.stringify(state.markdownFiles)) return
  state.markdownFiles = files
  const picker = document.getElementById("doc-picker")
  if (picker && document.activeElement !== picker) {
    const extra = files.filter((file) => !artifacts.includes(file))
    const option = (file) => `<option value="${escape(file)}" ${file === state.artifact ? "selected" : ""}>${escape(file)}</option>`
    picker.innerHTML = artifacts.map(option).join("") + (extra.length ? `<optgroup label="All Markdown files">${extra.map(option).join("")}</optgroup>` : "")
  }
}

function showDocument(path) {
  state.artifact = path
  state.section = "files"
  closeDetails()
  render()
  document.getElementById("artifact").innerHTML = "Loading…"
  loadArtifact()
  document.getElementById("docs-card")?.scrollIntoView({ behavior: "smooth", block: "start" })
}

function docPanel(detail, path) {
  const text = state.docCache[path]
  if (text === undefined) {
    fetch(`api/projects/${encodeURIComponent(state.selected)}/file?path=${encodeURIComponent(path)}`)
      .then((r) => (r.ok ? r.text() : ""))
      .then((body) => { state.docCache[path] = body; if (state.panel?.kind === "doc" && state.panel.id === path) renderDetails() })
    return { title: path.split("/").pop(), sub: path, body: `<p class="muted">Loading…</p>` }
  }
  return { title: path.split("/").pop(), sub: path, body: `<div class="section-actions"><button class="small-button" data-show-doc="${escape(path)}">Open in documents</button></div>${markdownDocument(text, path, { compact: true })}` }
}

async function loadMockups() {
  const base = `api/projects/${encodeURIComponent(state.selected)}/mockups`
  const images = await fetch(base).then((r) => (r.ok ? r.json() : [])).catch(() => [])
  const el = document.getElementById("artifact")
  if (!el) return
  el.innerHTML = images.length
    ? `<div class="mockups">${images.map((image) => `<a href="${base}/${encodeURIComponent(image)}" target="_blank" rel="noopener"><img src="${base}/${encodeURIComponent(image)}" alt="Mockup ${escape(image)}" loading="lazy"><span>${escape(image)}</span></a>`).join("")}</div>`
    : "No mockups yet (design/mockups/)"
}

// Markdown: a small renderer that escapes everything first and only emits tags it builds itself.
const markdown = (() => {
  const imagePattern = /\.(png|jpe?g|webp|gif)$/i
  const safeScheme = (url) => !/^[a-z][a-z0-9+.-]*:/i.test(url) || /^(https?|mailto):/i.test(url)

  function resolvePath(base, relative) {
    const parts = (base ? base.split("/").slice(0, -1) : []).concat(relative.split("/"))
    const out = []
    for (const part of parts) {
      if (!part || part === ".") continue
      if (part === "..") out.pop()
      else out.push(part)
    }
    return out.join("/")
  }

  function slugify(text, used) {
    const base = text.toLowerCase().replace(/<[^>]*>/g, "").replace(/&[a-z#0-9]+;/g, "").replace(/[^\w\s-]/g, "").trim().replace(/\s+/g, "-") || "section"
    let slug = base
    for (let n = 2; used.has(slug); n++) slug = `${base}-${n}`
    used.add(slug)
    return slug
  }

  function inline(text, options) {
    const codes = []
    let html = escape(text).replace(/`([^`]+)`/g, (_, code) => `\u0000${codes.push(code) - 1}\u0000`)
    html = html.replace(/!\[([^\]]*)\]\(((?:[^()\s]|\([^()\s]*\))+)(?:\s+&quot;[^&]*&quot;)?\)/g, (all, alt, url) => {
      const raw = url.replace(/&amp;/g, "&")
      if (!safeScheme(raw)) return alt
      const src = /^https?:/i.test(raw) ? url : options.project && imagePattern.test(raw) ? `api/projects/${encodeURIComponent(options.project)}/raw?path=${encodeURIComponent(resolvePath(options.path, raw))}` : null
      return src ? `<img src="${src}" alt="${alt}" loading="lazy">` : alt
    })
    html = html.replace(/\[([^\]]+)\]\(((?:[^()\s]|\([^()\s]*\))+)(?:\s+&quot;[^&]*&quot;)?\)/g, (all, label, url) => {
      const raw = url.replace(/&amp;/g, "&")
      if (!safeScheme(raw)) return label
      if (raw.startsWith("#")) return `<button type="button" class="md-link" data-md-anchor="${escape(raw.slice(1).toLowerCase())}">${label}</button>`
      if (/^(https?|mailto):/i.test(raw)) return `<a href="${url}" target="_blank" rel="noopener noreferrer">${label}</a>`
      const target = resolvePath(options.path, raw.split("#")[0])
      if (/\.md$/i.test(target)) return `<button type="button" class="md-link" data-open-md="${escape(target)}">${label}</button>`
      return options.project ? `<a href="api/projects/${encodeURIComponent(options.project)}/file?path=${encodeURIComponent(target)}" target="_blank" rel="noopener">${label}</a>` : label
    })
    // Autolinks and emphasis only touch text between the tags built above, never attribute values.
    let insideLink = false
    html = html.split(/(<[^>]+>)/).map((part) => {
      if (part.startsWith("<")) {
        if (/^<a\b/.test(part)) insideLink = true
        if (part === "</a>") insideLink = false
        return part
      }
      const linked = insideLink ? part : part.replace(/(^|[\s(])(https?:\/\/[^\s<]+[^\s<.,;:!?)])/g, '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>')
      return linked
        .replace(/\*\*([^*]+)\*\*|__([^_]+)__/g, (_, a, b) => `<strong>${a ?? b}</strong>`)
        .replace(/(^|[^\w*])\*([^*\s][^*]*)\*(?!\w)/g, "$1<em>$2</em>")
        .replace(/(^|[^\w])_([^_\s][^_]*)_(?!\w)/g, "$1<em>$2</em>")
        .replace(/~~([^~]+)~~/g, "<del>$1</del>")
    }).join("")
    // Code spans were captured from already-escaped text, so they are restored as is.
    return html.replace(/\u0000(\d+)\u0000/g, (_, index) => `<code>${codes[Number(index)]}</code>`)
  }

  const listItemPattern = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/
  const tableSeparator = /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/
  const splitRow = (line) => line.trim().replace(/^\|/, "").replace(/\|$/, "").split(/(?<!\\)\|/).map((cell) => cell.trim().replace(/\\\|/g, "|"))

  function list(lines, options) {
    const items = []
    const baseIndent = listItemPattern.exec(lines[0])[1].length
    for (const line of lines) {
      const match = listItemPattern.exec(line)
      if (match && match[1].length <= baseIndent + 1) items.push({ marker: match[2], lines: [match[3]] })
      else items.at(-1)?.lines.push(line.slice(Math.min(baseIndent + 2, line.search(/\S|$/))))
    }
    const ordered = /\d/.test(items[0].marker)
    const start = ordered ? Number.parseInt(items[0].marker, 10) : 1
    const body = items.map((item) => {
      const [first, ...rest] = item.lines
      const task = /^\[([ xX])\]\s+(.*)$/.exec(first)
      const lead = task ? `<span class="md-check ${task[1] === " " ? "" : "done"}" aria-hidden="true">${task[1] === " " ? "" : "✓"}</span>${inline(task[2], options)}` : inline(first, options)
      const nested = rest.join("\n").trim() ? blocks(rest.join("\n"), options) : ""
      return `<li${task ? ' class="task"' : ""}>${lead}${nested}</li>`
    }).join("")
    return ordered ? `<ol${start !== 1 ? ` start="${start}"` : ""}>${body}</ol>` : `<ul>${body}</ul>`
  }

  function blocks(source, options) {
    const lines = source.replace(/\r\n?/g, "\n").split("\n")
    const out = []
    let i = 0
    while (i < lines.length) {
      const line = lines[i]
      if (!line.trim()) { i++; continue }
      const fence = /^\s*(```|~~~)\s*([\w+#.-]*)/.exec(line)
      if (fence) {
        const code = []
        for (i++; i < lines.length && !lines[i].trim().startsWith(fence[1]); i++) code.push(lines[i])
        i++
        const text = code.join("\n")
        out.push(`<div class="md-code"><div class="md-code-head"><span>${escape(fence[2] || "text")}</span><button type="button" class="small-button" data-copy="${escape(text)}">Copy</button></div><pre><code>${escape(text)}</code></pre></div>`)
        continue
      }
      const heading = /^(#{1,6})\s+(.*?)\s*#*\s*$/.exec(line)
      if (heading) {
        const level = heading[1].length
        const html = inline(heading[2], options)
        const id = slugify(html, options.used)
        options.headings.push({ level, id, text: heading[2].replace(/[`*_]/g, "") })
        out.push(`<h${level} class="md-heading" data-md-id="${id}">${html}<button type="button" class="md-anchor" data-md-anchor="${id}" aria-label="Link to this section">#</button></h${level}>`)
        i++
        continue
      }
      if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) { out.push("<hr>"); i++; continue }
      if (/^\s*>/.test(line)) {
        const quote = []
        for (; i < lines.length && /^\s*>/.test(lines[i]); i++) quote.push(lines[i].replace(/^\s*>\s?/, ""))
        out.push(`<blockquote>${blocks(quote.join("\n"), options)}</blockquote>`)
        continue
      }
      if (line.includes("|") && tableSeparator.test(lines[i + 1] ?? "")) {
        const head = splitRow(line)
        const align = splitRow(lines[i + 1]).map((cell) => (cell.startsWith(":") && cell.endsWith(":") ? "center" : cell.endsWith(":") ? "right" : ""))
        const rows = []
        for (i += 2; i < lines.length && lines[i].includes("|") && lines[i].trim(); i++) rows.push(splitRow(lines[i]))
        const cell = (tag, text, index) => `<${tag}${align[index] ? ` style="text-align:${align[index]}"` : ""}>${inline(text ?? "", options)}</${tag}>`
        out.push(`<div class="md-table"><table><thead><tr>${head.map((h, index) => cell("th", h, index)).join("")}</tr></thead><tbody>${rows.map((row) => `<tr>${head.map((_, index) => cell("td", row[index], index)).join("")}</tr>`).join("")}</tbody></table></div>`)
        continue
      }
      if (listItemPattern.test(line)) {
        const items = []
        const [, baseIndent, baseMarker] = listItemPattern.exec(line)
        const ordered = /\d/.test(baseMarker)
        for (; i < lines.length; i++) {
          const current = lines[i]
          const item = listItemPattern.exec(current)
          if (item && item[1].length <= baseIndent.length && /\d/.test(item[2]) !== ordered) break
          if (item || (current.trim() && /^\s{2,}/.test(current))) items.push(current)
          else if (!current.trim() && (listItemPattern.test(lines[i + 1] ?? "") || /^\s{2,}\S/.test(lines[i + 1] ?? ""))) items.push("")
          else break
        }
        out.push(list(items, options))
        continue
      }
      const paragraph = []
      for (; i < lines.length && lines[i].trim() && !/^\s*(#{1,6}\s|```|~~~|>)/.test(lines[i]) && !listItemPattern.test(lines[i]) && !(lines[i].includes("|") && tableSeparator.test(lines[i + 1] ?? "")); i++) paragraph.push(lines[i])
      out.push(`<p>${paragraph.map((part, index) => inline(part.trim(), options) + (index < paragraph.length - 1 ? (/ {2,}$/.test(part) ? "<br>" : " ") : "")).join("")}</p>`)
    }
    return out.join("")
  }

  return {
    render(source, options = {}) {
      const context = { project: options.project ?? null, path: options.path ?? "", used: new Set(), headings: [] }
      return { html: blocks(String(source ?? ""), context), headings: context.headings }
    },
  }
})()

function prettyJson(text) {
  try { return JSON.stringify(JSON.parse(text), null, 2) } catch { return text }
}

async function openTranscript(row) {
  const file = row.dataset.transcript
  if (!file) return
  const attemptMatch = /-(\d+)\.log$/.exec(file)
  document.getElementById("drawer-title").textContent = `${row.dataset.subject} · ${row.dataset.role} · ${row.dataset.runner} ${row.dataset.model}`
  document.getElementById("drawer-sub").textContent = `${file}${attemptMatch ? ` · runner attempt ${attemptMatch[1]}` : ""}`
  document.getElementById("drawer-body").innerHTML = `<p class="muted">Loading…</p>`
  document.getElementById("drawer").classList.add("open")
  document.getElementById("drawer").setAttribute("aria-hidden", "false")
  document.getElementById("scrim").classList.add("open")
  state.lastFocus = document.activeElement
  document.getElementById("drawer-close").focus()
  const response = await fetch(`api/projects/${encodeURIComponent(state.selected)}/transcript/${encodeURIComponent(file)}`)
  state.transcript = response.ok ? await response.text() : "Transcript not found."
  renderDrawer()
}

function closeDrawer() {
  const drawer = document.getElementById("drawer")
  if (!drawer.classList.contains("open")) return false
  drawer.classList.remove("open")
  drawer.setAttribute("aria-hidden", "true")
  document.getElementById("scrim").classList.remove("open")
  state.lastFocus?.focus?.()
  return true
}

function maxRetriesOf(detail) {
  return detail.config?.roles?.worker?.maxRetries ?? 3
}

function openDetails(panel) {
  state.panel = panel
  writeHash()
  const details = document.getElementById("details")
  const wasOpen = details.classList.contains("open")
  if (!wasOpen) state.detailsFocus = document.activeElement
  details.classList.add("open")
  details.setAttribute("aria-hidden", "false")
  document.getElementById("details-scrim").classList.add("open")
  document.getElementById("details-body").scrollTop = 0
  renderDetails()
  if (!wasOpen) document.getElementById("details-close").focus()
}

function closeDetails() {
  const details = document.getElementById("details")
  const wasOpen = details.classList.contains("open")
  state.panel = null
  details.classList.remove("open")
  details.setAttribute("aria-hidden", "true")
  document.getElementById("details-scrim").classList.remove("open")
  writeHash()
  if (wasOpen) state.detailsFocus?.focus?.()
  return wasOpen
}

const kv = (rows) => `<dl class="kv">${rows.filter(([, v]) => v !== null && v !== undefined && v !== "").map(([k, v]) => `<dt>${escape(k)}</dt><dd>${v}</dd>`).join("")}</dl>`
const section = (title, body) => `<section><h4 class="section-title">${escape(title)}</h4>${body}</section>`
const paths = (list) => list?.length ? `<div class="path-list">${list.map((p) => `<code>${escape(p)}</code>`).join("")}</div>` : `<span class="muted">none</span>`
const statusBadge = (status) => `<span class="badge ${escape(status)}"><span class="dot ${status === "done" ? "ok" : escape(status)}"></span>${escape(String(status).replace("_", " "))}</span>`
const candidate = (role) => role ? `<span class="mono">${escape(role.runner)} ${escape(role.model)}</span>${role.fallbacks?.length ? ` <span class="muted">→ ${role.fallbacks.map((f) => `${escape(f.runner)} ${escape(f.model)}`).join(" → ")}</span>` : ""}` : `<span class="muted">not configured</span>`

function callButton(attempt, label) {
  return `<button class="call" data-transcript="${escape(attempt.transcript)}" data-subject="${escape(attempt.subject)}" data-role="${escape(attempt.role)}" data-runner="${escape(attempt.runner)}" data-model="${escape(attempt.model)}" aria-label="Open transcript ${escape(attempt.subject)}">
    <span class="what">${escape(label ?? attempt.role)}</span><span class="mono muted">${escape(attempt.runner)} ${escape(attempt.model)}</span><span>${statusBadge(attempt.status)}</span>
    <span class="detail">${duration(attempt.durationMs)}${attempt.failureClass ? ` · ${escape(attempt.failureClass)}` : ""}${attempt.costUsd ? ` · $${attempt.costUsd.toFixed(3)}` : ""} · ${time(attempt.createdAt)}</span></button>`
}

function commandButton(file, subject, label) {
  return `<button class="call" data-transcript="${escape(file)}" data-subject="${escape(subject)}" data-role="${escape(label)}" data-runner="host" data-model="sh" aria-label="Open ${escape(label)} output">
    <span class="what">${escape(label)}</span><span class="mono muted">${escape(file)}</span><span></span></button>`
}

function eventsList(events) {
  return events.length ? `<div class="log">${events.slice(-40).map((e) => `<div class="log-row" data-event="${escape(e.id)}" tabindex="0" role="button"><span class="log-time">${time(e.at)}</span><span class="tag ${escape(e.type)}">${escape(e.type)}</span><span class="log-msg">${escape(e.message)}</span></div>`).join("")}</div>` : `<div class="empty">No related events.</div>`
}

function pullRequestFor(detail, prefix) {
  return detail.github?.pullRequests?.find((pr) => pr.title.startsWith(prefix)) ?? null
}

function githubLinks(detail, issueNumber, pr) {
  const repo = detail.github?.repoUrl
  const links = []
  if (repo && issueNumber) links.push(`<a href="${escape(repo)}/issues/${issueNumber}" target="_blank" rel="noopener">Issue #${issueNumber}</a>`)
  if (pr) links.push(`<a href="${escape(pr.url)}" target="_blank" rel="noopener">PR #${pr.number} · ${escape(pr.state?.toLowerCase() ?? "")}</a>`)
  return links.length ? `<div class="links">${links.join("")}</div>` : null
}

function taskPanel(detail, id) {
  const task = detail.tasks.find((t) => t.id === id)
  if (!task) return { title: id, sub: "Task not found", body: `<p class="muted">This task is not in the current plan.</p>` }
  const maxRetries = maxRetriesOf(detail)
  const calls = detail.attempts.filter((a) => a.subject.startsWith(`${id}-`)).slice().reverse()
  const attemptNumbers = [...new Set(calls.map((a) => Number(/-(\d+)$/.exec(a.subject)?.[1] ?? 0)))].sort((a, b) => a - b)
  const timeline = attemptNumbers.map((n) => {
    const group = calls.filter((a) => a.subject.endsWith(`-${n}`))
    const worker = group.filter((a) => a.role === "worker")
    const review = group.filter((a) => a.role === "reviewer")
    return `<div class="attempt-group">Attempt ${n}</div>
      ${commandButton(`${id}-${n}-setup.log`, `${id}-${n}`, "setup")}
      ${worker.map((a) => callButton(a, "worker")).join("")}
      ${worker.some((a) => a.status === "done") ? commandButton(`${id}-${n}-verify.log`, `${id}-${n}`, "verify") : ""}
      ${review.map((a) => callButton(a, "review")).join("")}`
  }).join("")
  const pattern = new RegExp(`\\b${id}\\b`)
  const related = detail.events.filter((e) => pattern.test(e.message))
  const merged = task.status === "merged"
  const links = githubLinks(detail, task.issueNumber, pullRequestFor(detail, `feat(${id})`))
  return {
    title: `${task.id} · ${task.title}`,
    sub: `${task.phase ?? "task"}${task.story ? ` · ${task.story}` : ""}`,
    body: [
      kv([
        ["Status", statusBadge(task.status)],
        ["Phase", escape(task.phase ?? "—")],
        ["Story", escape(task.story ?? "")],
        ["Attempts", `${task.attempts} / ${maxRetries}`],
        ["Depends on", task.dependsOn?.length ? task.dependsOn.map((d) => `<button class="link-button" data-open-task="${escape(d)}">${escape(d)}</button>`).join(", ") : `<span class="muted">nothing</span>`],
        ["Worker", candidate(detail.config?.roles?.worker)],
        ["Reviewer", candidate(detail.config?.roles?.reviewer)],
      ]),
      links ? section("GitHub", links) : "",
      task.acceptance?.length ? section("Acceptance criteria", `<ul class="checklist">${task.acceptance.map((c) => `<li><span class="box ${merged ? "checked" : ""}" aria-hidden="true">${merged ? "✓" : ""}</span><span>${escape(c)}</span></li>`).join("")}</ul>`) : "",
      task.verify ? section("Verify", `<div class="verify"><code>${escape(task.verify)}</code><button class="small-button" data-copy="${escape(task.verify)}">Copy</button></div>`) : "",
      section("Scope", kv([["Allowed paths", paths(task.allowedPaths)], ["Reads", paths(task.readPaths)]])),
      task.lastFailure ? section("Last failure", `<details class="collapsible" ${task.status === "blocked" ? "open" : ""}><summary>${escape(task.lastFailure.split("\n")[0].slice(0, 120))}</summary><div class="failure">${escape(task.lastFailure)}</div></details>`) : "",
      section("Agent calls", timeline ? `<div class="calls">${timeline}</div>` : `<div class="empty">No agent calls yet.</div>`),
      section("Related activity", eventsList(related)),
    ].join(""),
  }
}

function liveUrlHtml(deploy) {
  if (!deploy?.url) return `<span class="muted">none</span>`
  return `<div class="verify"><a href="${escape(deploy.url)}" target="_blank" rel="noopener noreferrer" class="mono">${escape(deploy.url)}</a><button class="small-button" data-copy="${escape(deploy.url)}">Copy</button></div>`
}

function deployPanel(detail) {
  const deploy = detail.deploy ?? {}
  const { status, sub } = deployState(detail)
  const events = detail.events.filter((e) => e.type === "deploy")
  return {
    title: "Deploy",
    sub: sub || status,
    body: [
      deploy.url ? `<a class="preview-button wide" href="${escape(deploy.url)}" target="_blank" rel="noopener noreferrer">Open live preview ↗</a>` : "",
      kv([
        ["Status", statusBadge(status === "approved" ? "done" : status).replace(">done<", `>${escape(sub || "deployed")}<`)],
        ["URL", liveUrlHtml(deploy)],
        ["App container", deploy.appContainer ? `<span class="mono">${escape(deploy.appContainer)}</span> · ${escape(deploy.app ?? "missing")}` : ""],
        ["Tunnel", deploy.tunnelContainer ? `<span class="mono">${escape(deploy.tunnelContainer)}</span> · ${escape(deploy.tunnel ?? "missing")}` : ""],
      ]),
      `<p class="muted" style="font-size:12px;margin:0">Quick tunnel URLs change when the tunnel container restarts. Redeploy with <code>agent-team deploy &lt;projectDir&gt;</code>.</p>`,
      section("Deploy events", eventsList(events)),
    ].join(""),
  }
}

function phasePanel(detail, phase) {
  if (phase === "deploy") return deployPanel(detail)
  const byName = Object.fromEntries(detail.phases.map((p) => [p.name, p]))
  if (phase === "build") {
    const counts = countTasks(detail.tasks)
    return {
      title: "Build",
      sub: `${counts.merged}/${detail.tasks.length} tasks merged`,
      body: [
        kv([
          ["Pending", counts.pending], ["Running", counts.running], ["Merged", counts.merged], ["Blocked", counts.blocked],
          ["Worker", candidate(detail.config?.roles?.worker)], ["Reviewer", candidate(detail.config?.roles?.reviewer)],
          ["Max attempts", maxRetriesOf(detail)],
          ["Live preview", liveUrlHtml(detail.deploy)],
        ]),
        section("Tasks", detail.tasks.length ? `<div class="calls">${detail.tasks.map((t) => `<button class="call" data-open-task="${escape(t.id)}"><span class="what">${escape(t.id)}</span><span>${escape(t.title)}</span><span>${statusBadge(t.status)}</span></button>`).join("")}</div>` : `<div class="empty">No plan yet.</div>`),
      ].join(""),
    }
  }
  const role = phaseRoles[phase]
  const status = skippedPhases(detail).has(phase) ? "skipped" : byName[phase]?.status ?? "pending"
  const calls = detail.attempts.filter((a) => a.subject.startsWith(`phase-${phase}-`)).slice().reverse()
  const related = detail.events.filter((e) => new RegExp(`\\b${phase}\\b`).test(e.message) && (e.type === "phase" || e.type === "gate" || e.type === "github"))
  const links = githubLinks(detail, null, pullRequestFor(detail, `docs(${phase})`))
  return {
    title: stepLabels[phase],
    sub: `${role} agent`,
    body: [
      kv([
        ["Status", statusBadge(status)],
        ["Role", escape(role)],
        ["Model", candidate(detail.config?.roles?.[role])],
        ["Gate", detail.config?.gates?.includes(phase) ? "human approval required" : "none"],
        ["Updated", byName[phase]?.updatedAt ? `${escape(new Date(byName[phase].updatedAt).toLocaleString())}` : ""],
      ]),
      section("Outputs", `${paths(phaseOutputs[phase])}<div style="margin-top:10px"><button class="small-button" data-open-artifact="${escape(phaseArtifacts[phase])}">Open ${escape(phaseArtifacts[phase] === "mockups" ? "mockups gallery" : phaseArtifacts[phase])}</button></div>`),
      links ? section("GitHub", links) : "",
      section("Agent calls", calls.length ? `<div class="calls">${calls.map((a) => callButton(a, `attempt ${/-(\d+)$/.exec(a.subject)?.[1] ?? ""}`)).join("")}</div>` : `<div class="empty">No agent calls yet.</div>`),
      section("Related activity", eventsList(related)),
    ].join(""),
  }
}

function eventPanel(detail, id) {
  const event = detail.events.find((e) => String(e.id) === String(id))
  if (!event) return { title: "Event", sub: "", body: `<p class="muted">This event is no longer in the recent log.</p>` }
  const taskIds = [...new Set(event.message.match(/\bT\d+\b/g) ?? [])].filter((t) => detail.tasks.some((task) => task.id === t))
  const phases = steps.filter((step) => step !== "build" && new RegExp(`\\b${step}\\b`).test(event.message))
  const openers = [
    ...taskIds.map((t) => `<button class="small-button" data-open-task="${escape(t)}">Open task ${escape(t)}</button>`),
    ...phases.map((ph) => `<button class="small-button" data-open-phase="${escape(ph)}">Open phase ${escape(stepLabels[ph])}</button>`),
  ]
  return {
    title: `${event.type} event`,
    sub: new Date(event.at).toLocaleString(),
    body: [
      kv([["Time", escape(new Date(event.at).toLocaleString())], ["Type", `<span class="tag ${escape(event.type)}">${escape(event.type)}</span>`]]),
      section("Message", `<div class="bubble">${escape(event.message)}</div>`),
      openers.length ? section("Related", `<div class="links">${openers.join("")}</div>`) : "",
    ].join(""),
  }
}

function runnerPanel(detail, runner) {
  const cooldown = detail.cooldowns.find((c) => c.runner === runner)
  const cooling = cooldown && cooldown.until > Date.now()
  const calls = detail.attempts.filter((a) => a.runner === runner)
  const failures = calls.filter((a) => a.failureClass)
  const roles = Object.entries(detail.config?.roles ?? {}).filter(([, r]) => r.runner === runner || r.fallbacks?.some((f) => f.runner === runner)).map(([name, r]) => `${name}${r.runner === runner ? "" : " (fallback)"}`)
  return {
    title: runner,
    sub: cooling ? "cooling down" : "healthy",
    body: [
      kv([
        ["Health", cooling ? statusBadge("awaiting_approval").replace("awaiting approval", "cooling down") : statusBadge("done").replace(">done<", ">healthy<")],
        ["Cooldown until", cooling ? escape(new Date(cooldown.until).toLocaleString()) : ""],
        ["Reason", cooling ? escape(cooldown.reason) : ""],
        ["Used by", roles.length ? escape(roles.join(", ")) : ""],
        ["Calls", `${calls.length} recent · ${failures.length} with a failure class`],
      ]),
      section("Recent calls", calls.length ? `<div class="calls">${calls.slice(0, 25).map((a) => callButton(a, `${a.role} · ${a.subject}`)).join("")}</div>` : `<div class="empty">No calls yet.</div>`),
    ].join(""),
  }
}

function containerPanel(detail, name) {
  const container = detail.containers.find((c) => c.name === name)
  return {
    title: name,
    sub: "agent container",
    body: container
      ? kv([["Name", `<span class="mono">${escape(container.name)}</span>`], ["Status", escape(container.status)], ["Running for", escape(container.runningFor)]])
      : `<p class="muted">This container has stopped.</p>`,
  }
}

function renderDetails() {
  const detail = state.detail
  const panel = state.panel
  if (!detail || !panel) return
  const builders = { task: taskPanel, phase: phasePanel, event: eventPanel, runner: runnerPanel, container: containerPanel, doc: docPanel }
  const content = builders[panel.kind]?.(detail, panel.id)
  if (!content) return
  const body = document.getElementById("details-body")
  const scroll = body.scrollTop
  const openDetails = [...body.querySelectorAll("details")].map((d) => d.open)
  document.getElementById("details-title").textContent = content.title
  document.getElementById("details-sub").textContent = content.sub
  const html = content.body
  if (body.dataset.html !== html) {
    body.innerHTML = html
    body.dataset.html = html
    body.querySelectorAll("details").forEach((d, i) => { if (openDetails[i] !== undefined) d.open = openDetails[i] })
    body.scrollTop = scroll
  }
}

function topDialog() {
  if (document.getElementById("drawer").classList.contains("open")) return document.getElementById("drawer")
  if (document.getElementById("details").classList.contains("open")) return document.getElementById("details")
  return null
}

function verdictHtml(text) {
  const match = /\{[\s\S]*"verdict"[\s\S]*\}/.exec(text ?? "")
  if (!match) return null
  try {
    const verdict = JSON.parse(match[0])
    const pass = verdict.verdict === "pass"
    const list = (items) => (items?.length ? `<ul>${items.map((i) => `<li>${escape(i)}</li>`).join("")}</ul>` : "")
    return `<div class="verdict ${pass ? "pass" : "fail"}"><div class="verdict-head">${pass ? "✓ PASS" : "✕ FAIL"}</div>
      ${verdict.reasons?.length ? `<h4>Reasons</h4>${list(verdict.reasons)}` : ""}${verdict.fixes?.length ? `<h4>Fixes</h4>${list(verdict.fixes)}` : ""}</div>`
  } catch { return null }
}

function parseTranscript(text) {
  const [stdout, stderr = ""] = text.split("\n--- stderr ---\n")
  const lines = stdout.split("\n").filter((l) => l.trim().startsWith("{"))
  const events = []
