  const parsed = lines.map((l) => { try { return JSON.parse(l) } catch { return null } }).filter(Boolean)
  if (parsed.length === 1 && "result" in parsed[0]) {
    const result = parsed[0]
    events.push({ kind: "meta", stats: { turns: result.num_turns, cost: result.total_cost_usd, duration: result.duration_ms, error: result.is_error } })
    events.push({ kind: result.is_error ? "error" : "message", text: String(result.result ?? "") })
  } else {
    for (const event of parsed) {
      const item = event.item
      if (event.type === "item.completed" && item?.type === "agent_message") events.push({ kind: "message", text: item.text })
      else if (event.type === "item.completed" && item?.type === "command_execution") events.push({ kind: "command", command: item.command, output: item.aggregated_output, exitCode: item.exit_code })
      else if (event.type === "item.completed" && item?.type === "file_change") events.push({ kind: "files", changes: item.changes ?? [] })
      else if (event.type === "turn.completed") events.push({ kind: "meta", stats: { input: event.usage?.input_tokens, output: event.usage?.output_tokens } })
      else if (event.type === "error" || event.type === "turn.failed") events.push({ kind: "error", text: event.message ?? event.error?.message ?? JSON.stringify(event) })
    }
  }
  if (!parsed.length && stdout.trim()) events.push({ kind: "raw", text: stdout })
  if (stderr.trim()) events.push({ kind: "stderr", text: stderr.trim() })
  return events
}

function renderDrawer() {
  document.querySelectorAll("[data-drawer-tab]").forEach((b) => b.classList.toggle("selected", b.dataset.drawerTab === state.drawerTab))
  const body = document.getElementById("drawer-body")
  const text = state.transcript ?? ""
  if (state.drawerTab === "raw") { body.innerHTML = `<pre class="raw">${escape(text)}</pre>`; return }
  const events = parseTranscript(text)
  const clean = (command) => String(command ?? "").replace(/^\/bin\/(ba)?sh -lc ["']?/, "").replace(/["']$/, "")
  body.innerHTML = `<div class="timeline">${events.map((e) => {
    if (e.kind === "message") return verdictHtml(e.text)
      ? `<div class="event review"><span class="event-label">Reviewer verdict</span>${verdictHtml(e.text)}</div>`
      : `<div class="event"><span class="event-label">Agent</span><div class="bubble md">${markdown.render(e.text).html}</div></div>`
    if (e.kind === "command") return `<div class="event"><div class="command"><div class="command-head"><code>${escape(clean(e.command))}</code><span class="badge ${e.exitCode === 0 ? "pass" : "fail"}">exit ${escape(e.exitCode ?? "?")}</span></div>
      ${e.output ? `<details><summary>Output (${e.output.split("\n").length} lines)</summary><pre>${escape(e.output.slice(-6000))}</pre></details>` : ""}</div></div>`
    if (e.kind === "files") return `<div class="event">${e.changes.map((c) => `<div class="file-row"><span class="file-kind ${escape(c.kind)}">${c.kind === "add" ? "A" : c.kind === "delete" ? "D" : "M"}</span><span class="path">${escape(String(c.path).replace(/^\/workspace\//, ""))}</span></div>`).join("")}</div>`
    if (e.kind === "meta") return `<div class="event"><div class="stat-row">${Object.entries(e.stats).filter(([, v]) => v != null).map(([k, v]) => `<span class="chip">${escape(k)}: ${escape(k === "cost" ? `$${Number(v).toFixed(3)}` : k === "duration" ? duration(v) : v)}</span>`).join("")}</div></div>`
    if (e.kind === "error") return `<div class="event error"><span class="event-label">Error</span><div class="failure">${escape(e.text)}</div></div>`
    if (e.kind === "stderr") return `<div class="event error"><details><summary class="muted">stderr</summary><pre class="raw">${escape(e.text.slice(-6000))}</pre></details></div>`
    return `<div class="event"><pre class="raw">${escape(e.text)}</pre></div>`
  }).join("") || `<p class="muted">Empty transcript.</p>`}</div>`
}

document.addEventListener("click", (event) => {
  const target = event.target
  const project = target.closest(".project")
  if (project) return select(project.dataset.name)
  const anchor = target.closest("[data-md-anchor]")
  if (anchor) {
    const scope = anchor.closest(".doc, .md, .details-body, .drawer-body") ?? document
    const heading = [...scope.querySelectorAll("[data-md-id]")].find((el) => el.dataset.mdId === anchor.dataset.mdAnchor) ?? document.querySelector(`[data-md-id="${CSS.escape(anchor.dataset.mdAnchor)}"]`)
    heading?.scrollIntoView({ behavior: "smooth", block: "start" })
    return
  }
  const openMd = target.closest("[data-open-md]")
  if (openMd) return showDocument(openMd.dataset.openMd)
  const showDoc = target.closest("[data-show-doc]")
  if (showDoc) return showDocument(showDoc.dataset.showDoc)
  const docPanelButton = target.closest("[data-open-doc-panel]")
  if (docPanelButton) return openDetails({ kind: "doc", id: docPanelButton.dataset.openDocPanel })
  const docMode = target.closest("[data-doc-mode]")
  if (docMode) {
    state.docMode = docMode.dataset.docMode
    const previous = document.getElementById("artifact")
    render()
    if (previous) document.getElementById("artifact").innerHTML = "Loading…"
    return loadArtifact()
  }
  if (target.closest("[data-doc-reader]")) return toggleReader()
  const openTask = target.closest("[data-open-task]")
  if (openTask) return openDetails({ kind: "task", id: openTask.dataset.openTask })
  const openPhase = target.closest("[data-open-phase]")
  if (openPhase) return openDetails({ kind: "phase", id: openPhase.dataset.openPhase })
  const openArtifact = target.closest("[data-open-artifact]")
  if (openArtifact) {
    state.artifact = openArtifact.dataset.openArtifact
    state.section = "files"
    closeDetails()
    render()
    loadArtifact()
    document.getElementById("artifact")?.scrollIntoView({ behavior: "smooth", block: "center" })
    return
  }
  const copy = target.closest("[data-copy]")
  if (copy) { navigator.clipboard?.writeText(copy.dataset.copy).then(() => { copy.textContent = "Copied"; setTimeout(() => (copy.textContent = "Copy"), 1200) }); return }
  const transcript = target.closest("[data-transcript]")
  if (transcript) return openTranscript(transcript)
  const task = target.closest("[data-task]")
  if (task) return openDetails({ kind: "task", id: task.dataset.task })
  const phase = target.closest("[data-phase]")
  if (phase) return openDetails({ kind: "phase", id: phase.dataset.phase })
  const logRow = target.closest("[data-event]")
  if (logRow) return openDetails({ kind: "event", id: logRow.dataset.event })
  const runner = target.closest("[data-runner]")
  if (runner) return openDetails({ kind: "runner", id: runner.dataset.runner })
  const container = target.closest("[data-container]")
  if (container) return openDetails({ kind: "container", id: container.dataset.container })
  const tab = target.closest("[data-artifact]")
  if (tab) { state.artifact = tab.dataset.artifact; document.getElementById("artifact").innerHTML = "Loading…"; render(); return loadArtifact() }
  const segment = target.closest("[data-segment]")
  if (segment) { state.section = segment.dataset.segment; return render() }
  const drawerTab = target.closest("[data-drawer-tab]")
  if (drawerTab) { state.drawerTab = drawerTab.dataset.drawerTab; return renderDrawer() }
  if (target.id === "scrim" || target.closest("#drawer-close")) return closeDrawer()
  if (target.id === "details-scrim" || target.closest("#details-close")) return closeDetails()
})
document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") { if (closeDrawer()) return; if (document.getElementById("details").classList.contains("open")) { closeDetails(); return } if (state.reader) toggleReader(false); return }
  if (event.key === "Tab") {
    const dialog = topDialog()
    if (!dialog) return
    const focusable = [...dialog.querySelectorAll('button, [href], [tabindex]:not([tabindex="-1"]), summary')].filter((el) => el.offsetParent !== null)
    if (!focusable.length) return
    const first = focusable[0]
    const last = focusable.at(-1)
    if (!dialog.contains(document.activeElement)) { event.preventDefault(); first.focus() }
    else if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus() }
    else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus() }
    return
  }
  if (event.key !== "Enter" && event.key !== " ") return
  const actionable = event.target.closest?.("tr[data-transcript], [data-event], [data-container]")
  if (!actionable) return
  event.preventDefault()
  actionable.click()
})
window.addEventListener("hashchange", () => {
  const fromHash = parseHash()
  if (fromHash.project && fromHash.project !== state.selected) {
    closeDetails()
    state.panel = fromHash.panel
    return select(fromHash.project, { keepPanel: true })
  }
  if (fromHash.panel && (fromHash.panel.kind !== state.panel?.kind || fromHash.panel.id !== state.panel?.id)) openDetails(fromHash.panel)
})
document.getElementById("switcher").addEventListener("change", (event) => select(event.target.value))
document.addEventListener("change", (event) => {
  if (event.target.id !== "doc-picker") return
  state.artifact = event.target.value
  document.getElementById("artifact").innerHTML = "Loading…"
  render()
  loadArtifact()
})

function toggleReader(force) {
  state.reader = force ?? !state.reader
  document.body.style.overflow = state.reader ? "hidden" : ""
  render()
  if (state.reader) document.querySelector("[data-doc-reader]")?.focus()
}

loadProjects()
setInterval(loadProjects, 5000)
</script>
</body>
</html>
